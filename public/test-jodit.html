<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jodit Editor Test</title>
    <link rel="stylesheet" href="/js/jodit/jodit.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #333; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Jodit Editor Test</h1>

    <div id="status"></div>

    <h2>Editor:</h2>
    <textarea id="test-editor" style="width:100%;height:400px;">
        <h2>Selamat Datang di Jodit</h2>
        <p>Ini adalah test editor untuk PPID.</p>
        <ul>
            <li>Font Poppins</li>
            <li>Font Size 16px</li>
            <li>Bold Text</li>
        </ul>
    </textarea>

    <script src="/js/jodit/jodit.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('status');

            // Check if Jodit is loaded
            if (typeof Jodit === 'undefined') {
                status.innerHTML = '<p class="error">❌ Jodit not loaded! Check console for errors.</p>';
                console.error('Jodit not loaded');
                return;
            }

            status.innerHTML = '<p class="success">✅ Jodit loaded! Version: ' + Jodit.version + '</p>';
            console.log('Jodit version:', Jodit.version);

            // Initialize Jodit
            const editor = Jodit.make('#test-editor', {
                height: 400,
                minHeight: 400,
                maxHeight: 600,

                // Toolbar configuration
                toolbar: true,
                toolbarButtonSize: 'middle',

                // Font families
                allowFonts: {
                    'Arial': 'arial,helvetica,sans-serif',
                    'Courier New': 'courier new,courier',
                    'Georgia': 'georgia,palatino',
                    'Times New Roman': 'times new roman,times',
                    'Verdana': 'verdana,geneva',
                    'Tahoma': 'tahoma,geneva',
                    'Poppins': 'Poppins,sans-serif',
                    'Inter': 'Inter,sans-serif',
                    'Roboto': 'Roboto,sans-serif',
                    'Open Sans': 'Open Sans,sans-serif',
                    'Lato': 'Lato,sans-serif',
                    'Montserrat': 'Montserrat,sans-serif',
                },

                // Font sizes
                allowSizes: ['8', '10', '12', '14', '16', '18', '20', '24', '28', '32', '36', '48', '56', '72'],

                // Default font
                defaultFont: 'Inter',

                // Colors
                allowColorPicker: true,

                // Placeholder
                placeholder: 'Mulai menulis konten di sini...',

                // Events
                events: {
                    afterInit: function() {
                        status.innerHTML = '<p class="success">✅ Editor initialized successfully!</p>';
                        console.log('Editor initialized');
                    }
                },

                // Misc settings
                askBeforePasteHTML: false,
                askBeforePasteFromWord: false,
                defaultActionOnPaste: 'insert_clear_html',
                showCharsCounter: true,
                showWordsCounter: true,
                showXPathInStatusbar: false,
            });
        });
    </script>
</body>
</html>
